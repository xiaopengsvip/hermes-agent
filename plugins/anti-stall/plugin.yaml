name: anti-stall
version: 1.1.0
description: "Detect and recover from agent reasoning loops, log crashes and SSH disconnects for analysis"
author: Everett (xiaopengsvip)
kind: standalone
provides_tools:
  - anti_stall_report
hooks:
  - pre_api_request
  - post_api_request
  - on_session_start
  - on_session_end
  - on_session_finalize
